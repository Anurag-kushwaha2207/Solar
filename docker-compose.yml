version: '3.9'

services:
  backend:
    build: ./backend
    container_name: urjamind-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./urjamind.db
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: urjamind-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
